<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Finanzas Personales</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#ffffff" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="icon" type="image/png" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Finanzas" />
<script>
  // Silenciar el aviso de "in-browser Babel transformer" (es solo informativo)
  (function(){
    var _w = console.warn;
    console.warn = function(){
      var m = arguments[0];
      if (typeof m === 'string' && m.indexOf('in-browser Babel transformer') !== -1) return;
      return _w.apply(console, arguments);
    };
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --text2: #636366;
    --text3: #aeaeb2;
    --sep: #e5e5ea;
    --blue: #072146;
    --blue-mid: #1f6feb;
    --blue-bright: #2f80ed;
    --green: #2f80ed;
    --red: #0a3a86;
    --orange: #5a8fd6;
    --black: #121212;
    --yellow: #ffcc00;
    --purple: #820ad1;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 16px -4px rgba(16,32,64,.12), 0 2px 6px -2px rgba(16,32,64,.08);
    --shadow-lg: 0 12px 32px -8px rgba(16,32,64,.18), 0 4px 12px -4px rgba(16,32,64,.10);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --nav-h: 80px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  /* Scrollbar oculto en toda la app (sin barra visible) */
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { width: 0; height: 0; display: none; }
  html, body, #root { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg); color: var(--text); overscroll-behavior: none;
  }
  #root { display: flex; flex-direction: column; max-width: 430px; margin: 0 auto; position: relative; }

  /* SCREEN STACK */
  .app-stack { position: relative; flex: 1; overflow: hidden; }
  .screen-view {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 24px);
    transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s;
    will-change: transform;
  }
  .screen-view.slide-in  { transform: translateX(0); opacity: 1; }
  .screen-view.slide-out { transform: translateX(-30%); opacity: 0; pointer-events: none; }
  .screen-view.slide-right { transform: translateX(100%); opacity: 0; pointer-events: none; }

  /* HEADER */
  .screen-header { padding: 56px 20px 8px; }
  .screen-title { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
  .screen-sub { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .detail-header {
    padding: 52px 16px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .back-btn {
    display: flex; align-items: center; gap: 3px;
    background: none; border: none; color: var(--blue);
    font-size: 17px; font-weight: 400; cursor: pointer; padding: 4px 0;
  }
  .back-btn svg { width: 20px; height: 20px; }

  /* NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    height: calc(var(--nav-h) + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-top: 1px solid var(--sep);
    display: flex; align-items: flex-start; justify-content: space-around;
    z-index: 50;
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 7px; height: var(--nav-h); background: none; border: none; cursor: pointer;
    color: var(--text3); transition: color .2s; -webkit-tap-highlight-color: transparent;
  }
  .nav-btn.active { color: var(--blue-mid); }
  .nav-line {
    width: 22px; height: 3px; border-radius: 2px; background: var(--blue-mid);
    opacity: 0; transform: scaleX(.3); transition: opacity .22s ease, transform .22s ease;
  }
  .nav-btn.active .nav-line { opacity: 1; transform: scaleX(1); }
  .nav-lbl { font-size: 13px; font-weight: 600; letter-spacing: .1px; }
  .nav-btn.active .nav-lbl { font-weight: 700; }

  /* ===== LAYOUT PC ===== */
  .app-root { display: flex; flex-direction: column; height: 100%; }
  .side { display: none; }
  .side-brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 19px; font-weight: 700; letter-spacing: -.3px; color: var(--text);
    padding: 2px 14px 6px;
  }
  .side-brand::before {
    content: ''; width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(145deg, #2f80ed, #0a3a86);
    box-shadow: 0 3px 10px -3px rgba(10,58,134,.55), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .side-eyebrow {
    font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text3); padding: 18px 18px 8px;
  }
  .side-btn {
    display: flex; align-items: center; text-align: left; background: none; border: none; cursor: pointer;
    font-size: 14.5px; font-weight: 550; color: var(--text2);
    padding: 11px 16px; border-radius: 11px; position: relative;
    transition: background .18s var(--ease-out), color .18s var(--ease-out), transform .12s var(--ease-out);
  }
  .side-btn:hover { background: rgba(16,32,64,.045); color: var(--text); }
  .side-btn:active { transform: scale(.98); }
  .side-btn.active { background: rgba(31,111,235,.10); color: var(--blue-mid); font-weight: 700; }
  .side-btn.active::before {
    content: ''; position: absolute; left: 3px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 18px; border-radius: 2px; background: var(--blue-mid);
  }
  @media (min-width: 900px) {
    html, body, #root { overflow: hidden; }
    body { background: #eceef2; }
    #root { max-width: 100%; }
    .app-root { flex-direction: row; }
    .side {
      display: flex; flex-direction: column; gap: 2px;
      width: 264px; flex-shrink: 0; height: 100%;
      border-right: 1px solid rgba(16,32,64,.07); padding: 30px 14px;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
    }
    .app-stack { flex: 1; width: 100%; background: var(--bg); }
    .bottom-nav { display: none; }
    .screen-view {
      padding-left: max(36px, calc((100% - 772px) / 2));
      padding-right: max(36px, calc((100% - 772px) / 2));
      padding-bottom: 60px;
    }
    .screen-header { padding: 46px 16px 16px; }
    .screen-title { font-size: 30px; letter-spacing: -.6px; }
    .detail-header { padding: 38px 16px 14px; }
    .card-list-item {
      border: 1px solid rgba(16,32,64,.06);
      box-shadow: var(--shadow-md);
      transition: transform .22s var(--ease-out), box-shadow .22s var(--ease-out);
    }
    .card-list-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  }
  @media (hover: hover) and (pointer: fine) {
    .btn-primary, .btn-secondary, .head-add { transition: transform .14s var(--ease-out), filter .14s var(--ease-out), background .15s var(--ease-out); }
    .btn-primary:hover, .head-add:hover { filter: brightness(1.06); }
  }
  .btn-primary:active, .btn-secondary:active { transform: scale(.97); }

  /* Header add button */
  .head-add {
    margin-top: 4px; width: 36px; height: 36px; border-radius: 50%;
    background: var(--blue); color: #fff; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,122,255,.35);
    transition: transform .12s;
  }
  .head-add:active { transform: scale(.92); }
  .head-add svg { width: 22px; height: 22px; }

  /* CARD WIDGET (list) */
  .card-list-item {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); margin: 0 16px 10px;
    overflow: hidden; animation: fadeUp .3s ease both;
    cursor: pointer; transition: transform .15s, box-shadow .15s;
    -webkit-user-select: none; user-select: none;
  }
  .card-flat {
    margin: 0 16px 9px; border-radius: var(--radius);
    padding: 13px 16px 13px; color: #fff; cursor: pointer;
    box-shadow: var(--shadow); animation: fadeUp .3s ease both;
    transition: transform .12s ease, filter .12s ease;
    -webkit-user-select: none; user-select: none;
  }
  .card-flat:active { transform: scale(.985); filter: brightness(.96); }
  .card-list-item:active { transform: scale(.985); box-shadow: 0 1px 8px rgba(0,0,0,.06); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* CC HEADER */
  .cc-header {
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 15px 16px 13px;
    color: #fff; position: relative; overflow: hidden;
  }
  .cc-name { font-size: 15px; font-weight: 700; }
  .cc-chips { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .cc-chip { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; background: rgba(255,255,255,.2); }
  .cc-amount { font-size: 27px; font-weight: 700; margin-top: 9px; letter-spacing: -.8px; }
  .cc-amount-label { font-size: 11px; opacity: .7; margin-top: 1px; }
  .cc-body { padding: 13px 16px 13px; }
  .cc-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .cc-stat { display: flex; flex-direction: column; }
  .cc-stat-val { font-size: 15px; font-weight: 600; }
  .cc-stat-lbl { font-size: 11px; color: var(--text2); margin-top: 1px; }
  .bar-wrap { margin: 11px 0 0; }
  .bar-bg { background: var(--sep); border-radius: 4px; height: 5px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .bar-labels { display: flex; justify-content: space-between; margin-top: 5px; }
  .bar-labels span { font-size: 11px; color: var(--text3); }
  .cc-days { display: flex; gap: 10px; margin-top: 8px; }
  .cc-day-badge {
    flex: 1; background: var(--bg); border-radius: var(--radius-sm);
    padding: 8px 6px; text-align: center;
  }
  .cc-day-badge .num { font-size: 20px; font-weight: 700; }
  .cc-day-badge .lbl { font-size: 10px; color: var(--text2); margin-top: 1px; }

  /* DETAIL TABS */
  .detail-tabs {
    display: flex; margin: 4px 16px 0;
    background: var(--bg); border-radius: var(--radius-sm);
    padding: 3px;
  }
  .detail-tab {
    flex: 1; padding: 7px 0; border-radius: 8px;
    font-size: 13px; font-weight: 600; border: none;
    background: none; color: var(--text2); cursor: pointer;
    transition: all .2s;
  }
  .detail-tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.1); }

  /* EXPENSE ITEMS — compact */
  .expense-item-sm {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; cursor: pointer;
    transition: background .12s;
  }
  .expense-item-sm:active { background: var(--bg); }
  .expense-icon-sm {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; background: var(--bg);
  }
  .expense-info-sm { flex: 1; min-width: 0; }
  .expense-desc-sm { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .expense-meta-sm { font-size: 11px; color: var(--text2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .expense-amt-sm { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .expense-amt-sm.paid { color: var(--text3); text-decoration: line-through; }

  /* OLD expense items (kept for list view if any) */
  .list-wrap { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin: 12px 16px; }

  /* CHECK BUTTON */
  .check-btn {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--sep);
    background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s; flex-shrink: 0;
  }
  .check-btn.checked { background: var(--green); border-color: var(--green); }
  .check-btn svg { width: 13px; height: 13px; color: #fff; }

  /* MSI */
  .msi-item { padding: 17px 18px; border-bottom: 1px solid var(--sep); }
  .msi-report-btn { flex-shrink:0; font-size:12.5px; font-weight:600; color:var(--text); background:var(--card);
    border:1px solid var(--sep); border-radius:999px; padding:7px 14px; cursor:pointer; transition:background .15s; }
  .msi-report-btn:active { background:var(--bg); }
  .msi-item:last-child { border-bottom: none; }
  .msi-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .msi-desc { font-size: 15px; font-weight: 500; }
  .msi-total { font-size: 15px; font-weight: 600; color: var(--blue); }
  .msi-meta { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .msi-dots { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .msi-dot {
    width: 30px; height: 30px; border-radius: 8px;
    border: 2px solid var(--sep); background: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: var(--text2);
    cursor: pointer; transition: all .2s; line-height: 1; text-align: center;
  }
  .msi-dot.paid { background: var(--blue); border-color: var(--blue); color: #fff; }
  .msi-dot.pre-paid { background: var(--text3); border-color: var(--text3); color: #fff; opacity: .7; }

  /* CATEGORY CHART */
  .cat-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--sep);
  }
  .cat-row:last-child { border-bottom: none; }
  .cat-emoji { font-size: 22px; width: 36px; text-align: center; flex-shrink: 0; }
  .cat-info { flex: 1; }
  .cat-name { font-size: 14px; font-weight: 500; }
  .cat-bar-wrap { margin-top: 4px; }
  .cat-amount { font-size: 14px; font-weight: 600; flex-shrink: 0; }

  /* MODAL / SHEET */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    z-index: 100; display: flex; align-items: center; justify-content: center;
    padding: 16px;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    width: 100%; max-width: 420px; margin: 0 auto;
    background: var(--card); border-radius: 24px;
    padding: 0 0 22px;
    max-height: 88vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.28);
    animation: popIn .26s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes popIn { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: none; } }
  .sheet-handle { display: none; }
  .sheet-title { font-size: 17px; font-weight: 700; text-align: center; padding: 20px 20px 14px; }
  .sheet-body { padding: 0 20px; }
  .field { margin-bottom: 14px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .4px; display: block; margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--bg); border: none; border-radius: var(--radius-sm);
    padding: 12px 14px; font-size: 16px; color: var(--text);
    font-family: inherit; outline: none; -webkit-appearance: none; appearance: none;
    transition: background .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { background: #e9e9ef; }
  .field textarea { resize: none; min-height: 72px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .sheet-actions { display: flex; gap: 10px; padding: 16px 20px 0; }
  .btn-primary {
    flex: 1; padding: 14px; border-radius: var(--radius-sm);
    background: var(--blue); color: #fff;
    font-size: 16px; font-weight: 600; border: none; cursor: pointer;
  }
  .btn-danger { padding: 14px; border-radius: var(--radius-sm); background: rgba(10,58,134,.10); color: var(--red); font-size: 16px; font-weight: 600; border: none; cursor: pointer; }
  .btn-secondary { flex: 1; padding: 14px; border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-size: 16px; font-weight: 600; border: none; cursor: pointer; }

  /* TOGGLE */
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg); border-radius: var(--radius-sm);
    padding: 13px 14px; margin-bottom: 14px;
  }
  .toggle-label { font-size: 14px; font-weight: 500; flex: 1; padding-right: 12px; }
  .toggle-label small { display: block; font-size: 11px; color: var(--text2); font-weight: 400; margin-top: 2px; }
  .toggle-switch {
    position: relative; width: 51px; height: 31px; flex-shrink: 0;
    border-radius: 16px; background: #e5e5ea;
    cursor: pointer; border: none; transition: background .25s;
  }
  .toggle-switch.on { background: var(--green); }
  .toggle-knob {
    position: absolute; top: 2px; left: 2px;
    width: 27px; height: 27px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25);
    transition: transform .25s cubic-bezier(.4,0,.2,1);
  }
  .toggle-switch.on .toggle-knob { transform: translateX(20px); }

  /* COLOR PICKER */
  .color-picker { display: flex; gap: 10px; flex-wrap: wrap; }
  .color-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform .15s; }
  .color-dot.selected { border-color: var(--text); transform: scale(1.15); }

  /* GRADIENTS */
  .grad-yellow  { background: linear-gradient(145deg, #e8b332, #cf9a1e); }
  .grad-red     { background: linear-gradient(145deg, #e53935, #c1272d); }
  .grad-blue    { background: linear-gradient(145deg, #1f82dd, #1257a0); }
  .grad-skyblue { background: linear-gradient(145deg, #039be5, #0379b0); }
  .grad-purple  { background: linear-gradient(145deg, #ab47bc, #8b3a9c); }
  .grad-orange  { background: linear-gradient(145deg, #f4511e, #cc3f12); }
  .grad-green   { background: linear-gradient(145deg, #3a9540, #29702d); }
  .grad-black    { background: linear-gradient(145deg, #3a3a3f, #141417); }
  .grad-graphite { background: linear-gradient(145deg, #5b6573, #313842); }
  .grad-teal     { background: linear-gradient(145deg, #16b9a6, #0c7a6e); }
  .grad-pink     { background: linear-gradient(145deg, #ec4899, #b81d6e); }
  .grad-indigo   { background: linear-gradient(145deg, #4254c5, #28307e); }
  .grad-gold     { background: linear-gradient(145deg, #caa14e, #93702a); }
  .grad-wine     { background: linear-gradient(145deg, #9b2742, #5f1628); }

  /* COMMITMENTS */
  .month-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; }
  .month-tabs::-webkit-scrollbar { display: none; }
  .month-tab { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; background: var(--bg); color: var(--text2); border: none; cursor: pointer; transition: all .2s; }
  .month-tab.active { background: var(--blue); color: #fff; }
  .commit-item { padding: 14px 16px; border-bottom: 1px solid var(--sep); }
  .commit-item:last-child { border-bottom: none; }
  .commit-top { display: flex; justify-content: space-between; align-items: center; }
  .commit-desc { font-size: 15px; font-weight: 500; }
  .commit-amount { font-size: 15px; font-weight: 600; }
  .commit-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .summary-row { display: flex; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--sep); }
  .summary-row span { font-size: 13px; color: var(--text2); }
  .summary-row strong { font-size: 13px; font-weight: 700; }

  .item-edit-btn { background: none; border: none; color: var(--blue); font-size: 12px; font-weight: 600; cursor: pointer; padding: 3px 0; opacity: .7; }
  .empty { text-align: center; padding: 40px 20px; color: var(--text2); }
  .empty .icon { font-size: 42px; margin-bottom: 8px; }
  .empty p { font-size: 14px; }
  select option { color: #000; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

  const d = today.getDate();

  const next = new Date(today.getFullYear(), today.getMonth()+1, day);
  return Math.round((next - today) / 86400000);
}

// ─── STORAGE ─────────────────────────────────────────────────────────────────
function useStorage(key, init) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
  });
  const set = useCallback(v => {
    setVal(prev => {
      const next = typeof v === 'function' ? v(prev) : v;
      localStorage.setItem(key, JSON.stringify(next));
      return next;
    });
  }, [key]);
  return [val, set];
}

// ─── FINANCIAL MODEL ─────────────────────────────────────────────────────────
// card.available = exact bank balance entered by user. NEVER mutated.
//
// EXPENSES:
//   toggle OFF + not paid  → bank hasn't charged yet → subtract
//   toggle OFF + paid      → bank charged, credit freed → no adjustment (net 0 vs base)
//   toggle ON  + any       → already in base → 0
//
// MSI:
//   paidCount = cuotas pre-existing when user added the MSI (already in base available).
//   extraPaid = paid.length - paidCount  (cuotas newly palomeaded AFTER adding)
//   stillOwed = total - paid.length      (cuotas not yet palomeaded)
//   → each extraPaid cuota adds back to available (bank charged, freed credit)
//   → each stillOwed cuota subtracts from available (reserved future debt)
//
// IMPORTANT: if paidCount is missing (legacy data), treat ALL current paid[] as pre-existing
//            so opening an old MSI doesn't suddenly move the available balance.

function computeCardTotals(card, expenses, msis, payments=[]) {
  const totalCredit = parseFloat(card.total)||0;
  const extension   = parseFloat(card.extension)||0;
  const baseAvail   = parseFloat(card.available)||0;

  // ── Expense adjustment ──
  // The toggle (alreadyDiscounted) only affects whether we subtract when NOT paid.
  // Palomear (paid=true) ALWAYS frees credit — regardless of toggle.
  //
  //   alreadyDiscounted=false, paid=false  → bank hasn't charged yet   → subtract
  //   alreadyDiscounted=false, paid=true   → bank charged, now settled  → +amount (cancel the subtract)
  //   alreadyDiscounted=true,  paid=false  → bank already has it        → 0 (already in base)
  //   alreadyDiscounted=true,  paid=true   → paid & settled             → +amount (credit freed)
  //
  // Simplified: paid=true always adds back. paid=false only subtracts if NOT already discounted.
  let expAdj = 0;
  expenses.forEach(e => {
    const amount = parseFloat(e.amount)||0;
    if (e.paid) {
      expAdj += amount;          // paid: bank charged it AND user settled → credit freed → +
    } else if (!e.alreadyDiscounted) {
      expAdj -= amount;          // pending, bank hasn't charged yet → -
    }
    // alreadyDiscounted=true + not paid → 0 (already in base, still owed but bank tracks it)
  });

  // ── MSI adjustment ──
  // baseAvail already reflects ALL pre-existing paid cuotas (paidCount) — bank took them.
  // Only NEW cuotas palomeated AFTER adding the MSI to the app add credit back.
  // newlyPaid = paid.length - paidCount  (cuotas ticked by user in the app)
  let msiAdj = 0;
  msis.forEach(m => {
    const monthly   = parseFloat(m.monthly)||0;
    const paidKeys  = m.paid||[];
    const paidCount = m.paidCount !== undefined && m.paidCount !== ''
      ? parseInt(m.paidCount)||0
      : paidKeys.length; // legacy: treat all as pre-existing → no adjustment
    const newlyPaid = Math.max(0, paidKeys.length - paidCount);
    msiAdj += newlyPaid * monthly;
  });

  // ── Payments (abonos) ──
  // Dinero que transferiste a la tarjeta: libera crédito (sube disponible)
  // y baja tu total a pagar. No se ata a un gasto concreto.
  const totalPayments = payments.reduce((a,p)=>a+(parseFloat(p.amount)||0),0);

  const realAvail = baseAvail + expAdj + msiAdj + totalPayments;
  const creditLine = totalCredit + extension;
  const used    = creditLine - realAvail;
  const usedPct = creditLine > 0 ? (used / creditLine) * 100 : 0;

  // "Total a pagar": unpaid expenses + remaining MSI cuotas − pagos hechos
  const unpaidExp = expenses.filter(e=>!e.paid).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const pendMsi   = msis.reduce((a,m)=>{
    const stillOwed = (parseInt(m.total)||0) - (m.paid||[]).length;
    return a + stillOwed * (parseFloat(m.monthly)||0);
  },0);
  const totalToPay = Math.max(0, unpaidExp + pendMsi - totalPayments);

  // ── Cycle breakdown (expenses + MSI cuotas) ──
  const expThisCycle = expenses.filter(e=>!e.paid && dueMonthsAway(e.date, card.cutDay, card.payDay) <= 0).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const expNextCycle = expenses.filter(e=>!e.paid && dueMonthsAway(e.date, card.cutDay, card.payDay) === 1).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const { thisCycleMsi, nextCycleMsi } = getMsiCycleAmounts(msis);

  // Los pagos reducen primero lo del ciclo actual
  const thisCycle = Math.max(0, (expThisCycle + thisCycleMsi) - totalPayments);

  return { totalCredit, extension, realAvail, used, usedPct, totalToPay, totalPayments,
    cutDays: daysUntil(parseInt(card.cutDay)||1),
    payDays: daysUntil(parseInt(card.payDay)||15),
    thisCycle,
    nextCycle:  expNextCycle + nextCycleMsi,
  };
}

// ─── CYCLE HELPER ────────────────────────────────────────────────────────────
// Returns true if a date string falls AFTER the card's cut day (next billing cycle)
function isNextCycle(dateStr, cutDay) {
  if (!dateStr) return false;
  const [y,m,d] = dateStr.split('-').map(Number);
  const expDate = new Date(y, m-1, d);
  const cut = parseInt(cutDay)||1;
  const cutThisMonth = new Date(today.getFullYear(), today.getMonth(), cut);
  return expDate > cutThisMonth;
}

// Meses que faltan para PAGAR un gasto, según corte y pago de la tarjeta.
// 0 = este mes (o atrasado), 1 = próximo mes, 2 = en dos meses...
// Una compra hecha DESPUÉS del corte entra al siguiente estado de cuenta.
// Si el día de pago cae ANTES que el de corte, ese estado se paga el mes siguiente al cierre.
function dueMonthsAway(dateStr, cutDay, payDay) {
  if (!dateStr) return 0;
  const [y,m,d] = dateStr.split('-').map(Number);
  const C = parseInt(cutDay)||1, P = parseInt(payDay)||15;
  let closeAbs = y*12 + (m-1);              // estado de cuenta que captura la compra
  if (d > C) closeAbs += 1;                 // comprado después del corte → siguiente estado
  const dueAbs = closeAbs + (P <= C ? 1 : 0); // si el pago < corte, se paga el mes siguiente
  return dueAbs - (currentYear*12 + currentMonth);
}
// Meses que faltan para una cuota MSI (por su propio mes asignado).
function msiMonthAway(yi, mi) {
  return (yi*12 + mi) - (currentYear*12 + currentMonth);
}

// Returns the date string for a given cuota index of an MSI
function msiCuotaDate(msi, index) {
  const mi = (parseInt(msi.startMonth) + index) % 12;
  const yi = parseInt(msi.startYear) + Math.floor((parseInt(msi.startMonth) + index) / 12);
  // Use day 1 of that month as the billing date
  return `${yi}-${String(mi+1).padStart(2,'0')}-01`;
}

// Returns { thisCycleMsi, nextCycleMsi } — unpaid cuotas grouped by current/next cycle
function getMsiCycleAmounts(msis) {
  let thisCycleMsi = 0, nextCycleMsi = 0;
  msis.forEach(m => {
    const total    = parseInt(m.total)||0;
    const monthly  = parseFloat(m.monthly)||0;
    const paidKeys = m.paid||[];
    for (let i = 0; i < total; i++) {
      const mi = (parseInt(m.startMonth)+i)%12;
      const yi = parseInt(m.startYear)+Math.floor((parseInt(m.startMonth)+i)/12);
      const mk = monthKey(yi,mi);
      if (paidKeys.includes(mk)) continue; // already paid, skip
      const away = msiMonthAway(yi, mi);
      if (away <= 0) thisCycleMsi += monthly;       // este mes o atrasada
      else if (away === 1) nextCycleMsi += monthly; // próximo mes
    }
  });
  return { thisCycleMsi, nextCycleMsi };
}

// Próximos 2 meses a pagar de UNA tarjeta: cuotas MSI de ese mes + gastos cuyo pago real cae ahí
function cardMonthsToPay(card, expenses, msis) {
  const out = [];
  for (let k=1;k<=2;k++){
    const d  = new Date(currentYear, currentMonth+k, 1);
    const mk = monthKey(d.getFullYear(), d.getMonth());
    let amount = 0;
    msis.forEach(m=>{
      const total=parseInt(m.total)||0, monthly=parseFloat(m.monthly)||0, paid=m.paid||[];
      for (let i=0;i<total;i++){
        const mi=(parseInt(m.startMonth)+i)%12;
        const yi=parseInt(m.startYear)+Math.floor((parseInt(m.startMonth)+i)/12);
        const cuotaMk=monthKey(yi,mi);
        if (cuotaMk===mk && !paid.includes(cuotaMk)) amount += monthly;
      }
    });
    amount += expenses
      .filter(e=>!e.paid && dueMonthsAway(e.date, card.cutDay, card.payDay) === k)
      .reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
    out.push({ label: MONTHS[d.getMonth()], year: d.getFullYear(), amount });
  }
  return out;
}

// ─── DETAIL: EXPENSES TAB ────────────────────────────────────────────────────
function fmtDateLabel(dateStr) {
  if (!dateStr) return '';
  const [y,m,d] = dateStr.split('-').map(Number);
  const date = new Date(y, m-1, d);
  const now = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((todayMid - new Date(y,m-1,d)) / 86400000);
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Ayer';
  return date.toLocaleDateString('es-MX',{day:'numeric',month:'short',year: y!==now.getFullYear()?'numeric':undefined}).toUpperCase();
}

function ExpensesTab({ expenses, cutDay, payDay, onToggle, onEdit }) {
  const thisCycleExp = expenses.filter(e => dueMonthsAway(e.date, cutDay, payDay) <= 0);
  const nextCycleExp = expenses.filter(e => dueMonthsAway(e.date, cutDay, payDay) >= 1);

  const pendThis = thisCycleExp.filter(e=>!e.paid).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const pendNext = nextCycleExp.filter(e=>!e.paid).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const paidAmt  = expenses.filter(e=>e.paid).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);

  // Group ALL expenses by date, newest first
  const sorted = [...expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const groups = [];
  sorted.forEach(exp => {
    const d = exp.date||'';
    const last = groups[groups.length-1];
    if (last && last.date===d) last.items.push(exp);
    else groups.push({ date:d, items:[exp] });
  });

  return (
    <>
      {/* ── Summary ── */}
      <div style={{margin:'2px 16px 10px',background:'var(--card)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)',padding:'12px 16px',display:'flex',alignItems:'center'}}>
        <div style={{flex:1}}>
          <div style={{fontSize:17,fontWeight:600,letterSpacing:-.3,color:pendThis>0?'var(--red)':'var(--text)'}}>{fmt(pendThis)}</div>
          <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>Este ciclo</div>
        </div>
        {pendNext > 0 && (
          <>
            <div style={{width:1,alignSelf:'stretch',background:'var(--sep)'}}/>
            <div style={{flex:1,paddingLeft:14}}>
              <div style={{fontSize:17,fontWeight:600,letterSpacing:-.3,color:'var(--blue)'}}>{fmt(pendNext)}</div>
              <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>Sig. ciclo</div>
            </div>
          </>
        )}
        <div style={{width:1,alignSelf:'stretch',background:'var(--sep)'}}/>
        <div style={{flex:1,paddingLeft:14}}>
          <div style={{fontSize:17,fontWeight:600,letterSpacing:-.3,color:'var(--green)'}}>{fmt(paidAmt)}</div>
          <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>Pagado</div>
        </div>
      </div>
      <div style={{fontSize:11,color:'var(--text3)',margin:'-2px 18px 8px'}}>Solo gastos. El total con MSI está arriba en “A pagar por mes”.</div>

      {/* ── Grouped list ── */}
      {expenses.length === 0
        ? <div className="empty"><div className="icon">🧾</div><p>Sin gastos. Toca + Gasto para agregar.</p></div>
        : groups.map(group => {
          const groupIsNext = dueMonthsAway(group.date, cutDay, payDay) >= 1;
          return (
            <div key={group.date} style={{marginBottom:4}}>
              <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 20px 5px'}}>
                <span style={{fontSize:12,fontWeight:600,color:'var(--text3)',letterSpacing:.3,textTransform:'uppercase'}}>
                  {fmtDateLabel(group.date)}
                </span>
                {groupIsNext && (
                  <span style={{fontSize:10,fontWeight:700,color:'var(--blue)',background:'rgba(0,122,255,.1)',padding:'1px 7px',borderRadius:20}}>
                    Sig. ciclo
                  </span>
                )}
              </div>
              <div className="list-wrap" style={{margin:'0 16px'}}>
                {group.items.map((exp,idx) => (
                  <div key={exp.id} className="expense-item-sm"
                    style={{borderBottom: idx<group.items.length-1?'1px solid var(--sep)':'none'}}
                    onClick={()=>onEdit(exp)}>
                    <div className="expense-icon-sm">{exp.cat.split(' ')[0]}</div>
                    <div className="expense-info-sm">
                      <div className="expense-desc-sm">{exp.desc}</div>
                      <div className="expense-meta-sm">
                        {exp.cat.split(' ').slice(1).join(' ')}
                        {exp.note ? <> · <em>{exp.note}</em></> : null}
                      </div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
                      <span className={`expense-amt-sm ${exp.paid?'paid':''}`}>{fmt(exp.amount)}</span>
                      <CheckBtn checked={exp.paid} onToggle={()=>onToggle(exp.id)}/>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })
      }
    </>
  );
}

        const paidAmount = paidKeys.length*monthly;
        return (
          <div key={item.id} className="msi-item">
            {/* Título + acción */}
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:17,fontWeight:700,letterSpacing:-.3}}>{item.desc}</div>
                <div style={{fontSize:12.5,color:'var(--text3)',marginTop:2}}>{rangeLabel} · {fmt(monthly)}/mes</div>
              </div>
              <button className="msi-report-btn" onClick={()=>onEdit(item)}>
                {remaining===0 ? '✓ Pagado' : 'Editar'}
              </button>
            </div>

            {/* Monto pagado de total */}
            <div style={{display:'flex',alignItems:'baseline',gap:8,margin:'14px 0 12px'}}>
              <span style={{fontSize:30,fontWeight:800,letterSpacing:-1,color:'var(--text)'}}>{fmt(paidAmount)}</span>
              <span style={{fontSize:14,fontWeight:500,color:'var(--text3)'}}>de {fmt(total*monthly)}</span>
            </div>

            {/* Barra segmentada (una por cuota, toca para marcar) */}
            <div style={{display:'flex',gap:4}}>
              {months.map((m)=>{
                const isPaid = paidKeys.includes(m.key);
                return (
                  <button key={m.num} onClick={()=>onTogglePaid(item.id,m.key)} title={`Cuota ${m.num}`}
                    style={{flex:1,height:12,borderRadius:6,border:'none',cursor:'pointer',padding:0,
                      background: isPaid?'var(--green)':'rgba(47,128,237,.18)',
                      transition:'background .2s'}}/>
                );
              })}
            </div>

            {/* Pendiente */}
            {remaining > 0 && (
              <div style={{fontSize:12.5,color:'var(--text2)',marginTop:11}}>
                Quedan <strong style={{color:'var(--text)'}}>{remaining} cuotas</strong> · {fmt(remaining*monthly)} pendiente
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── DETAIL: CATEGORIES TAB ──────────────────────────────────────────────────
function CategoriesTab({ expenses }) {
  const data = useMemo(()=>{
    const map = {};
    expenses.forEach(e=>{
      const k = e.cat; const a = parseFloat(e.amount)||0;
      map[k] = (map[k]||0) + a;
    });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  }, [expenses]);
  const max = data.length ? data[0][1] : 1;
  if (!data.length) return <div className="empty"><div className="icon">📊</div><p>Sin datos de categorías</p></div>;
  return (
    <div className="list-wrap">
      {data.map(([cat,amt])=>(
        <div key={cat} className="cat-row">
          <div className="cat-emoji">{cat.split(' ')[0]}</div>
          <div className="cat-info">
            <div className="cat-name">{cat.split(' ').slice(1).join(' ')}</div>
            <div className="cat-bar-wrap">
              <ProgressBar pct={(amt/max)*100} color="var(--blue)"/>
            </div>
          </div>
          <div className="cat-amount">{fmt(amt)}</div>
        </div>
      ))}
    </div>
  );
}

// ─── DETAIL: PAYMENTS TAB ────────────────────────────────────────────────────
function PaymentsTab({ payments, onEdit }) {
  if (!payments.length) return (
    <div className="empty"><div className="icon">💸</div><p>Sin pagos. Toca + Pago para registrar un abono a la tarjeta.</p></div>
  );
  const total  = payments.reduce((a,p)=>a+(parseFloat(p.amount)||0),0);
  const sorted = [...payments].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return (
    <>
      <div style={{margin:'2px 16px 10px',background:'var(--card)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)',padding:'12px 16px'}}>
        <div style={{fontSize:17,fontWeight:600,letterSpacing:-.3,color:'var(--green)'}}>{fmt(total)}</div>
        <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>Total abonado</div>
      </div>
      <div className="list-wrap" style={{margin:'0 16px'}}>
        {sorted.map((p,idx)=>(
          <div key={p.id} className="expense-item-sm"
            style={{borderBottom: idx<sorted.length-1?'1px solid var(--sep)':'none'}}
            onClick={()=>onEdit(p)}>
            <div className="expense-icon-sm" style={{background:'rgba(47,128,237,.12)'}}>💸</div>
            <div className="expense-info-sm">
              <div className="expense-desc-sm">Pago{p.note?` · ${p.note}`:''}</div>
              <div className="expense-meta-sm">{fmtDateLabel(p.date)}</div>
            </div>
            <span className="expense-amt-sm" style={{color:'var(--green)'}}>+{fmt(p.amount)}</span>
          </div>
        ))}
      </div>
    </>
  );
}

  const { realAvail, usedPct, totalToPay, cutDays, payDays, totalCredit, extension, thisCycle } = computeCardTotals(card, expenses, msis, payments);
  // A pagar por mes (este mes + próximos 2), gastos + MSI
  const nextMonths = cardMonthsToPay(card, expenses, msis);
  const detailMonths = [
    { label:'Este mes', amount: thisCycle, current:true },
    ...nextMonths.map(m=>({ label:m.label, amount:m.amount, current:false })),

  const handleAdd = () => {
    if (activeTab === 'gastos') onAddExpense(card.id);

      <div style={{background:'var(--card)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)',margin:'0 16px 10px',padding:'14px 16px'}}>

        {activeTab==='pagos'      && <PaymentsTab payments={payments} onEdit={p=>onEditPayment(p,card.id)}/>}

    </div>
  );
}

    <Sheet title={initial?'Editar Tarjeta':'Nueva Tarjeta'} onClose={onClose}>

        <div className="field-row">
          <div className="field"><label>Crédito Total</label><input type="number" value={f.total} onChange={set('total')} placeholder="0" inputMode="decimal"/></div>
          <div className="field"><label>Extensión</label><input type="number" value={f.extension} onChange={set('extension')} placeholder="0" inputMode="decimal"/></div>
        </div>

        <button className="btn-primary" onClick={()=>{if(f.desc){onSave(f);onClose();}}}>Agregar</button>
      </div>
    </Sheet>

}

function MsiForm({ initial, onSave, onDelete, onClose }) {
  const blank = {
    desc:'', monthly:'', total:'', startMonth:currentMonth, startYear:currentYear,
    paid:[], paidCount:''
  };
  const [f, setF] = useState(initial
    ? { ...initial,
        monthly: initial.monthly===0?'':initial.monthly,
        total:   initial.total===0?'':initial.total,
        paidCount: '' }
    : blank);
  const set = k => e => setF(p=>({...p,[k]:e.target.value}));

  const totalNum  = parseInt(f.total)||0;
  const paidNum   = Math.min(parseInt(f.paidCount)||0, totalNum);
  const isEditing = !!initial;
  // Vista previa: primera y última cuota según fecha de inicio
  const sMv = parseInt(f.startMonth)||0, sYv = parseInt(f.startYear)||currentYear;
  const lastIdx = Math.max(0, totalNum-1);
  const lMi = (sMv+lastIdx)%12, lYi = sYv + Math.floor((sMv+lastIdx)/12);
  const datePreview = totalNum>0
    ? `Primera cuota: ${MONTHS[sMv]} ${sYv}  ·  Última: ${MONTHS[lMi]} ${lYi}`
    : '';

  return (
    <Sheet title={initial?'Editar MSI':'Nuevo MSI / Diferido'} onClose={onClose}>
      <div className="sheet-body">
        <div className="field"><label>Descripción</label>
          <input value={f.desc} onChange={set('desc')} placeholder="ej. MacBook 12 MSI"/>
        </div>
        <div className="field-row">
          <div className="field"><label>Cuota Mensual ($)</label>
            <input type="number" value={f.monthly} onChange={set('monthly')} placeholder="0.00" inputMode="decimal"/>
          </div>
          <div className="field"><label>Núm. de Cuotas</label>
            <input type="number" min="1" max="60" value={f.total} onChange={set('total')} placeholder="12" inputMode="numeric"/>
          </div>
        </div>
        <div className="field-row">
          <div className="field"><label>Mes Inicio</label>
            <select value={f.startMonth} onChange={set('startMonth')}>
              {MONTHS.map((m,i)=><option key={i} value={i}>{m}</option>)}
            </select>
          </div>
          <div className="field"><label>Año</label>
            <input type="number" min="2020" max="2035" value={f.startYear} onChange={set('startYear')}/>
          </div>
        </div>
        {datePreview && (
          <div style={{display:'flex',gap:8,alignItems:'center',background:'rgba(0,122,255,.06)',borderRadius:'var(--radius-sm)',padding:'9px 13px',marginBottom:14,fontSize:12.5,color:'var(--text2)',marginTop:-2}}>
            📅 {datePreview}
          </div>
        )}

        {/* Only show paidCount when creating new */}
        {!isEditing && (
          <div className="field">
            <label>¿Cuántas cuotas ya pagaste?</label>
            <input type="number" min="0" max={totalNum||60} value={f.paidCount}
              onChange={set('paidCount')} placeholder="0 si empiezas desde cero"
              inputMode="numeric"/>
            {paidNum > 0 && totalNum > 0 && (
              <div style={{fontSize:12,color:'var(--blue)',marginTop:5,padding:'6px 0'}}>
                Las cuotas 1–{paidNum} se marcarán como pagadas automáticamente
              </div>
            )}
          </div>
        )}

        {/* Info note — no toggle needed, bank always reflects MSI fully */}
        <div style={{
          background:'rgba(0,122,255,.06)', borderRadius:'var(--radius-sm)',
          padding:'10px 14px', marginBottom:14,
          fontSize:13, color:'var(--text2)', lineHeight:1.4,
        }}>
          💡 El banco ya descontó el crédito completo del MSI. Cada cuota que palomees como pagada libera ese crédito en tu disponible.
        </div>
      </div>
      <div className="sheet-actions">
        {initial && <button className="btn-danger" onClick={()=>{onDelete(initial.id);onClose();}}>Eliminar</button>}
        <button className="btn-secondary" onClick={onClose}>Cancelar</button>
        <button className="btn-primary" onClick={()=>{
          if (!f.desc || !f.monthly) return;
          const keyAt = (i)=>{
            const mi=(parseInt(f.startMonth)+i)%12;
            const yi=(parseInt(f.startYear)||currentYear)+Math.floor((parseInt(f.startMonth)+i)/12);
            return monthKey(yi,mi);
          };
          // nº de cuotas pagadas: al crear = lo capturado; al editar = lo que ya tenía
          const paidN = isEditing
            ? Math.min((parseInt(initial.paidCount)|| (initial.paid? initial.paid.length:0)), totalNum)
            : paidNum;
          // Regenera las pagadas desde la fecha de inicio (mantiene consistencia si cambian las fechas)
          const prePaid = Array.from({length: Math.max(0,paidN)}, (_,i)=>keyAt(i));
          onSave({...f, paid: prePaid, paidCount: paidN});
          onClose();
        }}>Guardar</button>
      </div>
    </Sheet>
  );
}

function Donut({ data, size=128, stroke=20 }) {
  const total = data.reduce((a,d)=>a+d.value,0) || 1;
  const r=(size-stroke)/2, c=2*Math.PI*r;
  let acc=0;
  return (
    <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--sep)" strokeWidth={stroke}/>
      {data.map((d,i)=>{
        const len=c*(d.value/total), gap=c-len, off=-acc; acc+=len;
        return <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={d.color} strokeWidth={stroke}
          strokeDasharray={`${len} ${gap}`} strokeDashoffset={off}
          style={{transition:'stroke-dasharray .6s ease'}}/>;
      })}
    </svg>
  );
}

  const diff = cashVal - thisMonth;

  const { catData, catItems } = (()=>{
    const map = {}, items = {};

    (expenses||[]).forEach(e=> add(e.cat||'📦 Otro', parseFloat(e.amount)||0, e.desc||'Gasto'));
    (msis||[]).forEach(m=>{
      const t=parseInt(m.total)||0, mo=parseFloat(m.monthly)||0, p=(m.paid||[]).length;
      add('📅 Meses sin intereses', Math.max(0,t-p)*mo, m.desc||'MSI');
    });
    const curMK = monthKey(currentYear, currentMonth);
    (commits||[]).forEach(c=>{
      const sm = monthKey(parseInt(c.year), parseInt(c.month));
      const mths = parseInt(c.repeat)||1;
      const end = new Date(parseInt(c.year), parseInt(c.month)+mths-1, 1);
      const endMK = monthKey(end.getFullYear(), end.getMonth());
      if (sm<=curMK && curMK<=endMK && !((c.paidMonths||[]).includes(curMK))) add(c.cat||'📦 Otro', parseFloat(c.amount)||0, c.desc||'Pago');
    });
    let arr = Object.entries(map).map(([label,value])=>({label,value})).filter(d=>d.value>0).sort((a,b)=>b.value-a.value);
    const top = arr.slice(0,6), rest = arr.slice(6);
    if (rest.length) {

      top.push({ label:'➕ Otros', value: rest.reduce((a,d)=>a+d.value,0) });
      items['➕ Otros'] = otrosItems;

    return { catData: top.map((d,i)=>({ ...d, color: PALETTE[i%PALETTE.length] })), catItems: items };

// ─── COMMITMENTS SCREEN ───────────────────────────────────────────────────────
function CommitmentsScreen({ commits, cards, expenses, msis, payments, onEdit, onTogglePaid, selMonth, setSelMonth }) {
  const [selDay, setSelDay] = useState(null);
  const [y, mIdx] = selMonth.split('-').map(Number); // mIdx 0-based
  const daysInMonth = new Date(y, mIdx+1, 0).getDate();
  const offset = (new Date(y, mIdx, 1).getDay()+6)%7; // semana inicia lunes
  const isCurMonth = selMonth === monthKey(currentYear, currentMonth);
  const todayD = today.getDate();

  const activeCommits = commits.filter(c=>{
    const sm = monthKey(parseInt(c.year),parseInt(c.month));
    const months = parseInt(c.repeat)||1;
    const endDate = new Date(parseInt(c.year),parseInt(c.month)+months-1,1);
    const endMK = monthKey(endDate.getFullYear(),endDate.getMonth());
    return sm<=selMonth && selMonth<=endMK;
  });

  const dues = [];
  activeCommits.forEach(c=>dues.push({
    day: Math.min(daysInMonth, parseInt(c.day)||1), kind:'commit', label:c.desc,
    sub:(c.cat||'').split(' ').slice(1).join(' '), amount:parseFloat(c.amount)||0,
    paid:(c.paidMonths||[]).includes(selMonth), ref:c,
  }));
  (cards||[]).forEach(cd=>{
    const amt = computeCardTotals(cd, expenses||[], msis||[], payments||[]).thisCycle;
    dues.push({
      day: Math.min(daysInMonth, parseInt(cd.payDay)||1), kind:'card',
      label:`Pago ${cd.name||'tarjeta'}`, sub:'Día de pago', amount: amt, ref:cd,
    });
  });
  (cards||[]).forEach(cd=>dues.push({
    day: Math.min(daysInMonth, parseInt(cd.cutDay)||1), kind:'cut',
    label:`Corte ${cd.name||'tarjeta'}`, sub:'Día de corte', amount:null, ref:cd,
  }));
  const pagoDays  = new Set(dues.filter(d=>d.kind!=='cut').map(d=>d.day));
  const corteDays = new Set(dues.filter(d=>d.kind==='cut').map(d=>d.day));
  const daySet = new Set(dues.map(d=>d.day));
  const unpaidDaySet = new Set(dues.filter(d=>(d.kind==='card'||d.kind==='commit')&&!d.paid).map(d=>d.day));

  const navMonth = delta => { const d=new Date(y, mIdx+delta, 1); setSelMonth(monthKey(d.getFullYear(), d.getMonth())); setSelDay(null); };
  const shown = (selDay ? dues.filter(d=>d.day===selDay) : dues).slice().sort((a,b)=>a.day-b.day);
  const pending = activeCommits.filter(c=>!((c.paidMonths||[]).includes(selMonth))).reduce((a,c)=>a+(parseFloat(c.amount)||0),0);

  const cells = [];
  for (let i=0;i<offset;i++) cells.push(null);
  for (let d=1;d<=daysInMonth;d++) cells.push(d);

  const iconBtn = { width:36,height:36,borderRadius:'50%',border:'1px solid var(--sep)',background:'var(--card)',
    display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'var(--blue-mid)' };

  return (
    <div style={{padding:'0 16px 16px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',margin:'2px 0 14px'}}>
        <button onClick={()=>navMonth(-1)} style={iconBtn}><span style={{width:18,height:18,display:'flex'}}><IconChevronLeft/></span></button>
        <div style={{fontSize:17,fontWeight:700}}>{MONTHS[mIdx]} {y}</div>
        <button onClick={()=>navMonth(1)} style={iconBtn}><span style={{width:18,height:18,display:'flex'}}><IconChevronRight/></span></button>
      </div>

      <div style={{background:'var(--card)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)',padding:'14px'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:6}}>
          {['L','M','M','J','V','S','D'].map((w,i)=><div key={i} style={{textAlign:'center',fontSize:10.5,fontWeight:600,color:'var(--text3)'}}>{w}</div>)}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
          {cells.map((d,i)=>{
            if (d===null) return <div key={i}/>;
            const has = daySet.has(d);
            const isToday = isCurMonth && d===todayD;
            const isSel = selDay===d;
            return (
              <button key={i} onClick={()=> has ? setSelDay(isSel?null:d) : setSelDay(null)}
                style={{aspectRatio:'1',border:'none',borderRadius:10,padding:0,
                  cursor: has?'pointer':'default',
                  background: isSel?'var(--blue)': isToday?'rgba(31,111,235,.12)':'transparent',
                  color: isSel?'#fff':'var(--text)',
                  display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3,
                  fontSize:13, fontWeight:(isToday||isSel)?700:500}}>
                {d}
                <span style={{display:'flex',gap:2,height:6,alignItems:'center',justifyContent:'center'}}>
                  {pagoDays.has(d) && <span style={{width:5,height:5,borderRadius:'50%',
                    background: isSel?'#fff': unpaidDaySet.has(d)?'var(--blue-mid)':'rgba(31,111,235,.4)'}}/>}
                  {corteDays.has(d) && <span style={{width:5,height:5,borderRadius:'50%',boxSizing:'border-box',
                    border:`1.5px solid ${isSel?'#fff':'var(--blue-mid)'}`,background:'transparent'}}/>}

      </div>

      <div style={{display:'flex',gap:18,alignItems:'center',justifyContent:'center',marginTop:11,fontSize:11.5,color:'var(--text3)'}}>
        <span style={{display:'flex',alignItems:'center',gap:5}}><span style={{width:6,height:6,borderRadius:'50%',background:'var(--blue-mid)'}}/>Pago</span>
        <span style={{display:'flex',alignItems:'center',gap:5}}><span style={{width:6,height:6,borderRadius:'50%',border:'1.5px solid var(--blue-mid)',boxSizing:'border-box'}}/>Corte</span>
      </div>

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',margin:'18px 2px 10px'}}>
        <div style={{fontSize:13,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:.4}}>{selDay?`Día ${selDay}`:'Pagos del mes'}</div>
        {selDay && <button onClick={()=>setSelDay(null)} style={{fontSize:12.5,color:'var(--blue-mid)',background:'none',border:'none',cursor:'pointer',fontWeight:600}}>Ver todos</button>}
      </div>

      {shown.length===0
        ? <div className="empty"><div className="icon">📅</div><p>{selDay?'Nada este día':'Sin pagos este mes'}</p></div>

                  </div>
                  <div style={{flex:1,minWidth:0,cursor:it.kind==='commit'?'pointer':'default'}}
                    onClick={it.kind==='commit'?()=>onEdit(it.ref):undefined}>
                    <div style={{fontSize:14.5,fontWeight:600,opacity:it.paid?.45:1,textDecoration:it.paid?'line-through':'none',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{it.label}</div>
                    <div style={{fontSize:12,color:'var(--text3)',marginTop:1}}>{it.sub}{urgent?' · vence pronto':''}</div>
                  </div>
                  {it.amount!=null && <span style={{fontSize:15,fontWeight:600,opacity:it.paid?.45:1}}>{fmt(it.amount)}</span>}
                  {it.kind==='commit'
                    ? <CheckBtn checked={it.paid} onToggle={()=>onTogglePaid(it.ref.id, selMonth)}/>
                    : <span style={{fontSize:10.5,color:'var(--text3)',border:'1px solid var(--sep)',borderRadius:6,padding:'2px 7px'}}>{it.kind==='cut'?'corte':'pago'}</span>}
                </div>
              );
            })}
          </div>}

      {activeCommits.length>0 && (
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:14,padding:'0 4px'}}>
          <span style={{fontSize:13,color:'var(--text2)'}}>Pendiente este mes</span>
          <strong style={{fontSize:16,color:'var(--blue-mid)'}}>{fmt(pending)}</strong>
        </div>
      )}
      <div style={{fontSize:11.5,color:'var(--text3)',marginTop:10,padding:'0 4px',lineHeight:1.4}}>
        Toca un pago fijo para editarlo · el ✓ lo marca como pagado · toca + arriba para agregar uno.
      </div>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]           = useState('home');
  const [detailCard, setDetail] = useState(null); // card obj | null
  const [cards, setCards]       = useStorage('fp_cards', []);
  const [expenses, setExpenses] = useStorage('fp_expenses', []);
  const [msis, setMsis]         = useStorage('fp_msis', []);
  const [payments, setPayments] = useStorage('fp_payments', []);
  const [commits, setCommits]   = useStorage('fp_commits', []);
  const [cash, setCash]         = useStorage('fp_cash', '');
  const [income, setIncome]     = useStorage('fp_income', '');

  const [cardModal,   setCardModal]   = useState(null);
  const [expModal,    setExpModal]    = useState(null);
  const [msiModal,    setMsiModal]    = useState(null);
  const [payModal,    setPayModal]    = useState(null);
  const [commitModal, setCommitModal] = useState(null);
  const [cashModal,   setCashModal]   = useState(false);
  const [incomeModal, setIncomeModal] = useState(false);
  const [selMonth,    setSelMonth]    = useState(currentMK);

  // ── Card CRUD ──
  const saveCard = c => {
    if (c.id) setCards(p=>p.map(x=>x.id===c.id?{...c}:x));
    else setCards(p=>[...p,{...c,id:uid()}]);
  };
  const deleteCard = id => {
    setCards(p=>p.filter(x=>x.id!==id));
    setExpenses(p=>p.filter(x=>x.cardId!==id));
    setMsis(p=>p.filter(x=>x.cardId!==id));
    setPayments(p=>p.filter(x=>x.cardId!==id));
    setCardModal(null);
    setDetail(null);
  };

  // ── Expense CRUD ── (card.available is NEVER touched — everything is derived)
  const saveExpense = (f, cardId) => {
    if (f.id) setExpenses(p=>p.map(x=>x.id===f.id?{...f,cardId}:x));
    else setExpenses(p=>[...p,{...f,id:uid(),cardId,paid:false}]);
  };
  const deleteExpense = id => setExpenses(p=>p.filter(x=>x.id!==id));
  const toggleExpense = id => setExpenses(p=>p.map(x=>x.id===id?{...x,paid:!x.paid}:x));

  // ── MSI CRUD ── (card.available is NEVER touched — everything is derived)
  const saveMsi = (f, cardId) => {
    if (f.id) setMsis(p=>p.map(x=>x.id===f.id?{...f,cardId}:x));
    else setMsis(p=>[...p,{...f,id:uid(),cardId}]);
  };
  const deleteMsi = id => setMsis(p=>p.filter(x=>x.id!==id));
  const toggleMsiPaid = (id, mk) => {
    setMsis(p=>p.map(x=>{
      if(x.id!==id) return x;
      const paid=[...(x.paid||[])];
      const nowPaid = !paid.includes(mk);
      return {...x, paid: nowPaid ? [...paid,mk] : paid.filter(k=>k!==mk)};
    }));
  };

  // ── Payment CRUD ── (abonos a la tarjeta — suben disponible, bajan deuda)
  const savePayment = (f, cardId) => {
    if (f.id) setPayments(p=>p.map(x=>x.id===f.id?{...f,cardId}:x));
    else setPayments(p=>[...p,{...f,id:uid(),cardId}]);
  };
  const deletePayment = id => setPayments(p=>p.filter(x=>x.id!==id));

  // ── Commitments CRUD ──
  const saveCommit = f => {
    if(f.id) setCommits(p=>p.map(x=>x.id===f.id?{...f}:x));
    else setCommits(p=>[...p,{...f,id:uid(),paidMonths:[]}]);
  };
  const deleteCommit = id => { setCommits(p=>p.filter(x=>x.id!==id)); setCommitModal(null); };
  const toggleCommitPaid = (id,mk) => setCommits(p=>p.map(x=>{
    if(x.id!==id) return x;
    const pm=x.paidMonths||[];
    return {...x,paidMonths:pm.includes(mk)?pm.filter(k=>k!==mk):[...pm,mk]};
  }));

  // ── FAB — only for list screens ──
  const handleFab = () => {
    if (tab==='cards') setCardModal('new');
    else setCommitModal('new');
  };

  const showDetail = detailCard !== null;

  // ── Totales del inicio (todas las tarjetas) ──
  const homeTotals = useMemo(()=>{
    let grandTotal=0, thisMonth=0;
    cards.forEach(c=>{
      const t = computeCardTotals(
        c,
        expenses.filter(e=>e.cardId===c.id),
        msis.filter(m=>m.cardId===c.id),
        payments.filter(p=>p.cardId===c.id)
      );
      grandTotal += t.totalToPay;
      thisMonth  += t.thisCycle;
    });
    // Pagos fijos activos este mes y no pagados → suman a "Este mes" (no a la deuda total)
    const curMK = monthKey(currentYear, currentMonth);
    commits.forEach(c=>{
      const sm = monthKey(parseInt(c.year), parseInt(c.month));
      const mths = parseInt(c.repeat)||1;
      const end = new Date(parseInt(c.year), parseInt(c.month)+mths-1, 1);
      const endMK = monthKey(end.getFullYear(), end.getMonth());
      if (sm <= curMK && curMK <= endMK && !((c.paidMonths||[]).includes(curMK))) {
        thisMonth += parseFloat(c.amount)||0;
      }
    });
    return { grandTotal, thisMonth, weekly: thisMonth/4 };
  }, [cards, expenses, msis, payments, commits]);

  // ── A pagar por mes — GENERAL (próximos 2 meses, todas las tarjetas) ──
  const monthsToPay = useMemo(()=>{
    const out = [];
    for (let k=1;k<=2;k++){
      const d  = new Date(currentYear, currentMonth+k, 1);
      const mk = monthKey(d.getFullYear(), d.getMonth());
      let amount = 0;
      msis.forEach(m=>{
        const total=parseInt(m.total)||0, monthly=parseFloat(m.monthly)||0, paid=m.paid||[];
        for (let i=0;i<total;i++){
          const mi=(parseInt(m.startMonth)+i)%12;
          const yi=parseInt(m.startYear)+Math.floor((parseInt(m.startMonth)+i)/12);
          const cuotaMk=monthKey(yi,mi);
          if (cuotaMk===mk && !paid.includes(cuotaMk)) amount += monthly;
        }
      });
      expenses.forEach(e=>{
        if (e.paid) return;
        const card = cards.find(c=>c.id===e.cardId);
        const cut = card ? card.cutDay : 1, pay = card ? card.payDay : 15;
        if (dueMonthsAway(e.date, cut, pay) === k) amount += parseFloat(e.amount)||0;
      });
      out.push({ mk, label: MONTHS[d.getMonth()], year: d.getFullYear(), amount });
    }
    return out;
  }, [cards, expenses, msis, payments]);

  // ── Próximos pagos (tarjetas que vencen dentro de 15 días) ──
  const upcomingPayments = useMemo(()=>{
    const list = [];
    cards.forEach(c=>{
      const t = computeCardTotals(
        c,
        expenses.filter(e=>e.cardId===c.id),
        msis.filter(m=>m.cardId===c.id),
        payments.filter(p=>p.cardId===c.id)
      );
      const days = daysUntil(parseInt(c.payDay)||15);
      if (days <= 15 && t.thisCycle > 0) {
        const dd = parseInt(c.payDay)||15;
        const date = dd >= today.getDate()
          ? new Date(currentYear, currentMonth, dd)
          : new Date(currentYear, currentMonth+1, dd);
        const ci = COLORS.find(x=>x.id===c.color)||COLORS[2];
        list.push({ id:c.id, name:c.name||'Sin nombre', hex:ci.hex, amount:t.thisCycle, days, date });
      }
    });
    // Pagos fijos (apartado Pagos) activos este mes y no pagados
    const curMK = monthKey(currentYear, currentMonth);
    commits.forEach(c=>{
      const sm = monthKey(parseInt(c.year), parseInt(c.month));
      const mths = parseInt(c.repeat)||1;
      const end = new Date(parseInt(c.year), parseInt(c.month)+mths-1, 1);
      const endMK = monthKey(end.getFullYear(), end.getMonth());
      const activeNow = sm <= curMK && curMK <= endMK;
      const paid = (c.paidMonths||[]).includes(curMK);
      if (activeNow && !paid && (parseFloat(c.amount)||0) > 0) {
        const dd = parseInt(c.day)||1;
        const date = dd >= today.getDate()
          ? new Date(currentYear, currentMonth, dd)
          : new Date(currentYear, currentMonth+1, dd);
        list.push({ id:'commit-'+c.id, name:c.desc||'Pago', amount:parseFloat(c.amount)||0,
          emoji:(c.cat||'📦 Otro').split(' ')[0], isCommit:true, date, days:daysUntil(dd) });
      }
    });
    list.sort((a,b)=>a.days-b.days);
    return list;
  }, [cards, expenses, msis, payments, commits]);

  // Alertas: pagos que vencen en ≤3 días
  const dueSoonCount = upcomingPayments.filter(p=>p.days<=3).length;

  // ── Respaldo de datos ──
  const BK_KEYS = ['fp_cards','fp_expenses','fp_msis','fp_payments','fp_commits','fp_cash','fp_income'];
  const [restoreData, setRestoreData] = useState(null); // datos en espera de confirmación
  const [bkMsg, setBkMsg] = useState('');
  const exportData = () => {
    const data = {};
    BK_KEYS.forEach(k=>{ const v=localStorage.getItem(k); if(v!==null) data[k]=v; });
    const payload = { app:'finanzas', version:1, exportedAt:new Date().toISOString(), data };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `finanzas-respaldo-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    setBkMsg('✓ Respaldo descargado');
  };
  const importData = (file) => {
    setBkMsg('');
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const data = parsed && parsed.data ? parsed.data : parsed;
        if (!data || !BK_KEYS.some(k=>k in data)) { setBkMsg('⚠️ Ese archivo no parece un respaldo válido.'); return; }
        setRestoreData(data); // abre confirmación dentro de la app
      } catch(e){ setBkMsg('⚠️ No se pudo leer el archivo: '+e.message); }
    };
    reader.onerror = () => setBkMsg('⚠️ No se pudo abrir el archivo.');
    reader.readAsText(file);
  };
  const applyRestore = () => {
    const data = restoreData; if (!data) return;
    const pv = (v, def) => { try { return typeof v==='string'?JSON.parse(v):v; } catch { return def; } };
    if ('fp_cards'    in data) setCards(pv(data.fp_cards, []));
    if ('fp_expenses' in data) setExpenses(pv(data.fp_expenses, []));
    if ('fp_msis'     in data) setMsis(pv(data.fp_msis, []));
    if ('fp_payments' in data) setPayments(pv(data.fp_payments, []));
    if ('fp_commits'  in data) setCommits(pv(data.fp_commits, []));
    if ('fp_cash'     in data) setCash(pv(data.fp_cash, ''));
    if ('fp_income'   in data) setIncome(pv(data.fp_income, ''));
    setRestoreData(null);
    setBkMsg('✓ Datos restaurados correctamente');
  };

  return (
    <div className="app-root">
      <aside className="side">
        <div className="side-brand">Finanzas</div>
        <div className="side-eyebrow">Menú</div>
        <button className={`side-btn ${tab==='home'?'active':''}`} onClick={()=>{setTab('home');setDetail(null);}}>Inicio</button>
        <button className={`side-btn ${tab==='cards'?'active':''}`} onClick={()=>{setTab('cards');setDetail(null);}}>Tarjetas</button>
        <button className={`side-btn ${tab==='commits'?'active':''}`} onClick={()=>{setTab('commits');setDetail(null);}}>Pagos</button>
      </aside>
      <div className="app-stack">

        {/* LIST SCREEN */}
        <div className={`screen-view ${showDetail ? 'slide-out' : 'slide-in'}`}>
          {tab==='home' && (
            <>
              <div className="screen-header">
                <div className="screen-title">Inicio</div>
                <div className="screen-sub">{cards.length===0?'Agrega tarjetas para ver tu resumen':'Resumen general'}</div>
              </div>
              {cards.length===0
                ? <div className="empty"><div className="icon">📊</div><p>Sin datos aún. Agrega una tarjeta en la pestaña Tarjetas.</p></div>
                : <HomeSummary {...homeTotals} months={monthsToPay} upcoming={upcomingPayments} cash={cash} income={income} expenses={expenses} msis={msis} commits={commits} onEditCash={()=>setCashModal(true)} onEditIncome={()=>setIncomeModal(true)}/>}

              {/* Respaldo de datos */}
              <div style={{margin:'4px 16px 20px',background:'var(--card)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)',padding:'15px 16px'}}>
                <div style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.6,marginBottom:10}}>Respaldo de datos</div>
                <div style={{display:'flex',gap:10}}>
                  <button className="btn-primary" onClick={exportData}>Exportar</button>
                  <button className="btn-secondary" onClick={()=>document.getElementById('bk-import').click()}>Restaurar</button>
                </div>
                <input id="bk-import" type="file" accept="application/json,.json" style={{display:'none'}}
                  onChange={e=>{ const f=e.target.files&&e.target.files[0]; if(f) importData(f); e.target.value=''; }}/>
                {bkMsg
                  ? <div style={{fontSize:12.5,fontWeight:600,marginTop:10,color: bkMsg[0]==='⚠'?'var(--red)':'var(--green)'}}>{bkMsg}</div>
                  : <div style={{fontSize:11.5,color:'var(--text3)',marginTop:10,lineHeight:1.4}}>Descarga un archivo con toda tu información, o restáuralo aquí o en otro equipo. Guárdalo en un lugar seguro.</div>}
              </div>
            </>
          )}
          {tab==='cards' && (
            <>
              <div className="screen-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
                <div>
                  <div className="screen-title">Tarjetas</div>
                  <div className="screen-sub">{cards.length===0?'Toca + para agregar tu primera tarjeta':`${cards.length} tarjeta${cards.length>1?'s':''}`}</div>
                </div>
                <button onClick={()=>setCardModal('new')} aria-label="Agregar tarjeta" className="head-add"><IconPlus/></button>
              </div>
              {cards.length===0 && <div className="empty"><div className="icon">💳</div><p>Sin tarjetas aún</p></div>}
              {cards.map((card,i)=>(
                <div key={card.id} style={{animationDelay:`${i*40}ms`}}>
                  <CardListItem
                    card={card}
                    expenses={expenses.filter(e=>e.cardId===card.id)}
                    msis={msis.filter(m=>m.cardId===card.id)}
                    payments={payments.filter(p=>p.cardId===card.id)}
                    onClick={()=>setDetail(card)}
                  />
                </div>
              ))}
            </>
          )}
          {tab==='commits' && (
            <>
              <div className="screen-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
                <div>
                  <div className="screen-title">Pagos</div>
                  <div className="screen-sub">Pagos mensuales y únicos</div>
                </div>
                <button onClick={()=>setCommitModal('new')} aria-label="Agregar pago" className="head-add"><IconPlus/></button>
              </div>
              <CommitmentsScreen
                commits={commits}
                cards={cards}
                expenses={expenses}
                msis={msis}
                payments={payments}
                onEdit={c=>setCommitModal(c)}
                onTogglePaid={toggleCommitPaid}
                selMonth={selMonth}
                setSelMonth={setSelMonth}
              />
            </>
          )}
        </div>

        {/* DETAIL SCREEN */}
        {detailCard && (
          <div className={`screen-view ${showDetail ? 'slide-in' : 'slide-right'}`} style={{zIndex:10}}>
            <CardDetail
              card={cards.find(c=>c.id===detailCard.id)||detailCard}
              expenses={expenses.filter(e=>e.cardId===detailCard.id)}
              msis={msis.filter(m=>m.cardId===detailCard.id)}
              payments={payments.filter(p=>p.cardId===detailCard.id)}
              onBack={()=>setDetail(null)}
              onEditCard={c=>setCardModal(c)}
              onToggleExpense={toggleExpense}
              onEditExpense={(exp,cid)=>setExpModal({cardId:cid, cutDay:cards.find(c=>c.id===cid)?.cutDay, payDay:cards.find(c=>c.id===cid)?.payDay, exp})}
              onAddExpense={cid=>setExpModal({cardId:cid, cutDay:cards.find(c=>c.id===cid)?.cutDay, payDay:cards.find(c=>c.id===cid)?.payDay})}
              onToggleMsiPaid={toggleMsiPaid}
              onEditMsi={(item,cid)=>setMsiModal({cardId:cid,item})}
              onAddMsi={cid=>setMsiModal({cardId:cid})}
              onEditPayment={(pay,cid)=>setPayModal({cardId:cid, pay})}
              onAddPayment={cid=>setPayModal({cardId:cid})}
            />
          </div>
        )}
      </div>

      {/* BOTTOM NAV */}
      <nav className="bottom-nav">
        <button className={`nav-btn ${tab==='home'?'active':''}`} onClick={()=>{setTab('home');setDetail(null);}}>
          <span className="nav-line"/>
          <span className="nav-lbl">Inicio</span>
        </button>
        <button className={`nav-btn ${tab==='cards'?'active':''}`} onClick={()=>{setTab('cards');setDetail(null);}}>
          <span className="nav-line"/>
          <span className="nav-lbl">Tarjetas</span>
        </button>
        <button className={`nav-btn ${tab==='commits'?'active':''}`} onClick={()=>{setTab('commits');setDetail(null);}}>
          <span className="nav-line"/>
          <span className="nav-lbl">Pagos</span>
        </button>
      </nav>

      {/* MODALS */}
      {(cardModal==='new'||(cardModal&&cardModal.id)) && (
        <CardForm
          initial={cardModal==='new'?null:cardModal}
          onSave={saveCard}
          onDelete={deleteCard}
          onClose={()=>setCardModal(null)}
        />
      )}
      {expModal && (
        <ExpenseForm
          initial={expModal.exp||null}
          cutDay={expModal.cutDay||1}
          payDay={expModal.payDay||15}
          onSave={f=>saveExpense(f,expModal.cardId)}
          onDelete={deleteExpense}
          onClose={()=>setExpModal(null)}
        />
      )}
      {msiModal && (
        <MsiForm
          initial={msiModal.item||null}
          onSave={f=>saveMsi(f,msiModal.cardId)}
          onDelete={deleteMsi}
          onClose={()=>setMsiModal(null)}
        />
      )}
      {payModal && (
        <PaymentForm
          initial={payModal.pay||null}
          onSave={f=>savePayment(f,payModal.cardId)}
          onDelete={deletePayment}
          onClose={()=>setPayModal(null)}
        />
      )}
      {commitModal && (
        <CommitForm
          initial={commitModal==='new'?null:commitModal}
          onSave={saveCommit}
          onDelete={deleteCommit}
          onClose={()=>setCommitModal(null)}
        />
      )}
      {cashModal && (
        <CashForm
          initial={cash}
          onSave={v=>setCash(v)}
          onClose={()=>setCashModal(false)}
        />
      )}
      {incomeModal && (
        <IncomeForm
          initial={income}
          onSave={v=>setIncome(v)}
          onClose={()=>setIncomeModal(false)}
        />
      )}
      {restoreData && (
        <Sheet title="Restaurar respaldo" onClose={()=>setRestoreData(null)}>
          <div className="sheet-body">
            <p style={{fontSize:14.5,color:'var(--text)',lineHeight:1.5,margin:'0 0 4px'}}>
              Esto <strong>reemplazará</strong> tus datos actuales (tarjetas, gastos, MSI y pagos) con los del archivo. Esta acción no se puede deshacer.
            </p>
          </div>
          <div className="sheet-actions">
            <button className="btn-secondary" onClick={()=>setRestoreData(null)}>Cancelar</button>
            <button className="btn-primary" onClick={applyRestore}>Restaurar</button>
          </div>
        </Sheet>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  // Registrar el service worker (PWA) — instalación e inicio offline
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
